name: Release

on:
  # Triggered when the builder itself changes (Dockerfile, layouts, etc.)
  push:
    branches: [main]
  # Manual rebuild — useful right after a content commit if you don't
  # want to wait for the scheduled run. (Actions tab → Run workflow.)
  workflow_dispatch:
  # Hourly rebuild — picks up changes from the content repo since the
  # last build. v1 trade-off: avoids the cross-repo PAT/App setup.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder (this repo)
        uses: actions/checkout@v4

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: TobiasHofmaenner/t-microcement-content
          path: .content-checkout
          ref: main

      - name: Merge content into builder workspace
        run: |
          cp -r .content-checkout/content ./content
          cp -r .content-checkout/static  ./static
          cp -r .content-checkout/assets  ./assets
          cp -r .content-checkout/layouts ./layouts
          cp    .content-checkout/hugo.toml ./hugo.toml
          ls -la content/ static/ assets/ layouts/ hugo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          TS=$(date +%s)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # main-<unix-ts>-<short-sha> — numerically ordered by build time
          # so Flux ImagePolicy(numerical, asc) picks the newest.
          echo "image=ghcr.io/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "tag=main-${TS}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed: ${{ steps.meta.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
