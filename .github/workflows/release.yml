name: Release

on:
  # Triggered when the builder itself changes (Dockerfile, layouts, etc.)
  push:
    branches: [main]
  # Manual rebuild — Actions tab → Run workflow.
  workflow_dispatch:
  # Fired from the content repo on every push to its main branch (via
  # `peter-evans/repository-dispatch`). Carries no payload — the
  # builder just rebuilds against `content@main` HEAD. Latency from
  # `git push` on the content repo to the build starting here is a
  # few seconds.
  repository_dispatch:
    types: [content-changed]
  # Daily safety-net rebuild — catches the rare case where a
  # repository_dispatch was dropped (network blip, PAT expiry) or
  # somehow never fired. Used to be hourly; once repository_dispatch
  # is reliable this can probably go away entirely.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder (this repo)
        uses: actions/checkout@v4

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: TobiasHofmaenner/t-microcement-content
          path: .content-checkout
          ref: main

      - name: Merge content into builder workspace
        run: |
          cp -r .content-checkout/content ./content
          cp -r .content-checkout/static  ./static
          cp -r .content-checkout/assets  ./assets
          cp -r .content-checkout/layouts ./layouts
          cp    .content-checkout/hugo.toml ./hugo.toml
          ls -la content/ static/ assets/ layouts/ hugo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          TS=$(date +%s)
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # main-<unix-ts>-<short-sha> — numerically ordered by build time
          # so Flux ImagePolicy(numerical, asc) picks the newest.
          echo "image=ghcr.io/${OWNER_LC}/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "tag=main-${TS}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print summary
        run: |
          echo "Pushed: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed: ${{ steps.meta.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"

      # Pings the cluster's Flux notification-controller so it rescans
      # GHCR immediately instead of waiting for its natural scan tick.
      # Especially useful for the hourly scheduled rebuild — content-only
      # changes show up minutes faster.
      #
      # Safe to remove: the cluster keeps polling on its own; this step
      # is purely a latency optimization.
      - name: Notify Flux to rescan ImageRepository
        if: success()
        env:
          WEBHOOK_URL: https://flux-webhook.thfops.net/hook/57de0284cc8fc9fe0d7e4a6795ba4b729aa7ea8e626ef9ec755b1fe0b1166d7a
          WEBHOOK_SECRET: ${{ secrets.THFOPS_RESCAN_HMAC }}
        run: |
          BODY=$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run "$GITHUB_RUN_ID" \
            --arg event "$GITHUB_EVENT_NAME" \
            '{trigger:"ghcr-push", commit:$sha, ref:$ref, run_id:$run, event:$event}')
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')"
          curl -sSf --max-time 10 -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Signature: $SIG" \
            -d "$BODY"
